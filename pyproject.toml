[project]
name = "lingua-calc"
version = "0.1.0"
description = "LGPSI-style chapter linguistic stats from .docx via Bedrock"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE.txt"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "python-docx>=1.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[project.scripts]
lingua-calc = "lingua_calc.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lingua_calc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
