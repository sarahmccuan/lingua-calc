<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lingua Calc</title>
    <link rel="stylesheet" href="/styles.css?v=25" />
  </head>
  <body>
    <header class="app-header">
      <h1>Lingua Calc</h1>
      <p class="tagline">Chapter stats from .docx (Ancient Greek via Bedrock)</p>
    </header>
    <main class="panel">
      <section class="upload-section" aria-label="Upload">
        <label class="file-label">
          <span class="file-label-text">Choose .docx files</span>
          <input id="file-input" type="file" multiple accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
        </label>
        <p id="file-name" class="file-name muted">No files selected</p>
        <button id="process-btn" type="button" disabled>Process files</button>
        <p id="status" class="status muted" role="status"></p>
      </section>

      <!-- Collapsed by default: history is plumbing, not one of the reading
           lenses issue #7 proposes, so it stays a single quiet line until
           asked for. (Note #7 is filed as the grammar-tracking issue; the
           lenses are in its discussion, not in CONTEXT.md's #7 section.) -->
      <details id="history" class="history-card hidden">
        <summary>
          <span>Run history</span>
          <span id="history-count" class="history-count"></span>
        </summary>
        <div id="history-body" class="history-body"></div>
      </details>

      <section id="report-root" class="report-root hidden" aria-label="Report"></section>
    </main>

    <script type="module" src="/app.js?v=25"></script>
  </body>
</html>
